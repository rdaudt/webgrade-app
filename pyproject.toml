[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webgrade"
version = "0.1.0"
description = "Windows-first CLI for website modernization audits."
readme = "specs/webgrade-prd.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "openai>=1.30,<2",
  "openpyxl>=3.1,<4",
  "pydantic>=2.7,<3",
  "playwright>=1.52,<2",
  "python-dotenv>=1.0,<2",
  "tqdm>=4.66,<5",
]

[tool.setuptools.packages.find]
include = ["webgrade*"]
